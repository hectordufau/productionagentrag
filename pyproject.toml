[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-agentic-rag"
version = "0.1.0"
description = "Provider-independent reference implementation for production Agentic RAG."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.13", "httpx>=0.27"]
semantic = ["sentence-transformers>=3.0,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: requires a live Qdrant service"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
